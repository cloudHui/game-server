<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻将 - 牌桌</title>
    <link rel="stylesheet" href="../../../shared/game-table.css">
    <link rel="stylesheet" href="../../../shared/game-landscape.css">
    <link rel="stylesheet" href="./mahjong.css">
    <script src="../../../shared/app-base.js"></script>
    <script src="../../../shared/game-table.js"></script>
    <script src="../../../shared/game-landscape.js"></script>
    <script src="../../../shared/mahjong-tile.js"></script>
    <script src="./mahjong-exposed.js"></script>
    <meta name="screen-orientation" content="landscape">
</head>
<body>
<div class="table-bg">
    <div class="top-bar">
        <span class="room-info" id="roomInfo">牌桌加载中...</span>
        <span id="tableState"></span>
        <button class="back-btn" id="refreshTableBtn" onclick="refreshTable()">刷新牌桌</button>
        <button class="back-btn" onclick="backToLobby()">返回房间列表</button>
        <button class="back-btn" onclick="exitRoom()" style="margin-left:8px;background:rgba(198,40,40,0.85);">
            退出房间
        </button>
    </div>
    <div class="ws-status" id="wsStatus">连接中...</div>
    <div class="wall-info" id="wallInfo"></div>

    <!-- 对面玩家 -->
    <div class="player-area player-top">
        <div class="player-info" id="playerTop">
            <span class="name">等待加入</span>
        </div>
        <!-- 对家：竖牌横排；副露在其右手=画面左上，手牌组与副露组留空隙 -->
        <div class="opponent-hand-row">
            <div class="opponent-exposed" id="exposedTop"></div>
            <div class="opponent-tiles" id="tilesTop"></div>
        </div>
    </div>

    <!-- 左边玩家 -->
    <div class="player-area player-left">
        <div class="player-info" id="playerLeft">
            <span class="name">等待加入</span>
        </div>
        <!-- 左家：副露在其右手=画面左下（手牌下方） -->
        <div class="opponent-hand-row">
            <div class="side-tiles" id="tilesLeft"></div>
            <div class="opponent-exposed" id="exposedLeft"></div>
        </div>
    </div>

    <!-- 右边玩家 -->
    <div class="player-area player-right">
        <div class="player-info" id="playerRight">
            <span class="name">等待加入</span>
        </div>
        <!-- 右家：副露在其右手=画面右上（手牌上方） -->
        <div class="opponent-hand-row">
            <div class="opponent-exposed" id="exposedRight"></div>
            <div class="side-tiles" id="tilesRight"></div>
        </div>
    </div>

    <!-- 打出的牌（中央） -->
    <div class="discarded-area discarded-center" id="discardedArea"></div>
    <div class="operation-arrow" id="operationArrow" aria-label="当前操作座位">
        <span class="operation-arrow-glyph">↑</span>
        <span class="operation-arrow-label"></span>
    </div>

    <!-- 中央消息 -->
    <div class="center-message" id="centerMsg"></div>

    <div class="settle-overlay" id="settleOverlay">
        <div class="settle-panel">
            <h3 id="settleTitle">本局结算</h3>
            <div class="meta" id="settleMeta"></div>
            <div id="settleRows"></div>
            <div class="settle-hands" id="settleHands"></div>
            <div class="settle-countdown" id="settleCountdown"></div>
            <button onclick="closeSettle()">继续</button>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar" id="actionBar" style="display:none;"></div>

    <!-- 底部手牌：副露在手牌最右侧并留空隙 -->
    <div class="player-area player-bottom">
        <div class="player-info" id="playerBottom">
            <span class="name" id="myName">我</span>
            <span class="tile-count" id="myTileCount"></span>
        </div>
        <div class="my-hand-row" id="myHandRow">
            <div class="my-tiles" id="myTiles"></div>
            <div class="my-exposed" id="myExposed"></div>
        </div>
    </div>
</div>

<script src="./mahjong-view.js"></script>
<script src="./mahjong-op.js"></script>
<script src="./mahjong.js"></script>
</body>
</html>
