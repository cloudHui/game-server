<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋 · 休闲</title>
    <script src="../../../shared/app-base.js"></script>
    <script src="../../../shared/mini-base.js"></script>
    <script src="../../../shared/canvas-buffer.js"></script>
    <link rel="stylesheet" href="../../../shared/mini-celebrate.css">
    <script src="../../../shared/mini-celebrate.js"></script>
    <script src="chess-rules.js"></script>
    <script src="chess-ai.js"></script>
    <script src="chess-view.js"></script>
    <style>
        :root {
            --bg0: #0f2a1c;
            --bg1: #1a472a;
            --card: rgba(255, 252, 245, 0.96);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 10%, rgba(201, 162, 39, .18), transparent 45%),
            linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #12301f);
        }

        .header {
            background: rgba(0, 0, 0, .3);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }

        .header h1 {
            font-size: 20px;
            color: #ffd700;
        }

        .header-btn {
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .28);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
        }

        .wrap {
            max-width: 640px;
            margin: 20px auto;
            padding: 0 12px 36px;
        }

        .panel {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
            margin-bottom: 12px;
        }

        .modes {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 10px;
        }

        .modes button, .actions button {
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
        }

        .modes button:first-child {
            background: linear-gradient(135deg, #1f5c36, #2d8a4e);
        }

        .modes button:last-child {
            background: linear-gradient(135deg, #c41e2a, #e63946);
        }

        .status {
            text-align: center;
            color: #ffd700;
            margin: 10px 0;
            min-height: 22px;
            font-size: 15px;
        }

        .board-wrap {
            display: flex;
            justify-content: center;
        }

        canvas {
            background: #f3d19c;
            border-radius: 8px;
            max-width: 100%;
            touch-action: none;
            box-shadow: inset 0 0 0 2px #8b6914;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .actions button {
            background: rgba(0, 0, 0, .55);
            min-width: 96px;
        }

        .hint {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }

        .difficulty {
            display: block;
            margin: 10px auto 0;
            text-align: center;
            font-size: 13px;
            color: #555;
        }

        .difficulty select {
            margin-left: 6px;
            padding: 5px 8px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>中国象棋</h1>
    <div>
        <span id="userDisplay" style="margin-right:10px;font-size:13px;"></span>
        <a class="header-btn" id="backLink" href="../index.html">返回小游戏</a>
    </div>
</div>
<div class="wrap">
    <div class="panel">
        <div class="modes">
            <button type="button" onclick="startLocal()">人机对战（你执红）</button>
            <button type="button" onclick="startOnline()">联机匹配</button>
        </div>
        <label class="difficulty" id="difficultyBox">AI 难度（人机模式生效）
            <select id="difficulty">
                <option value="1">入门：只看当前局面</option>
                <option value="2" selected>标准：考虑一步反击</option>
                <option value="3">挑战：完整评估反击</option>
                <option value="4">大师：限时迭代加深</option>
            </select>
        </label>
        <p class="hint">红在下方 · 吃将判胜 · 联机为人对人</p>
    </div>
    <div class="status" id="status">请选择模式</div>
    <div class="board-wrap">
        <canvas id="board" width="450" height="500"></canvas>
    </div>
    <div class="actions">
        <button type="button" id="resignBtn" onclick="resignGame()" disabled>认输</button>
        <button type="button" id="cancelBtn" onclick="cancelOnline()" style="display:none;">取消匹配</button>
        <button type="button" onclick="resetToMenu()">重选模式</button>
    </div>
</div>
<script src="chess.js"></script>
</body>
</html>
