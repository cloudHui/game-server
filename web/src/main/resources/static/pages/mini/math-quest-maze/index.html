<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>数学迷宫 · 休闲</title>
    <script src="../../../shared/app-base.js"></script>
    <script src="../../../shared/mini-base.js"></script>
    <script src="../../../shared/canvas-buffer.js"></script>
    <link rel="stylesheet" href="../../../shared/mini-celebrate.css">
    <script src="../../../shared/mini-celebrate.js"></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: #102027;
            color: #fff;
            min-height: 100vh
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(0, 0, 0, .35)
        }

        h1 {
            margin: 0;
            font-size: 20px;
            color: #80cbc4
        }

        .back {
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff6;
            padding: 6px 12px;
            border-radius: 7px
        }

        main {
            max-width: 760px;
            margin: 14px auto;
            padding: 0 12px 24px
        }

        .hud {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            color: #ffe082
        }

        canvas {
            width: 100%;
            max-width: 720px;
            background: #263238;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            touch-action: none
        }

        .controls {
            display: grid;
            grid-template-columns:repeat(3, 72px);
            gap: 8px;
            justify-content: center;
            margin-top: 12px
        }

        .controls button {
            padding: 14px 0;
            border: 0;
            border-radius: 10px;
            background: #455a64;
            color: #fff;
            font-size: 18px;
            cursor: pointer
        }

        .controls .up {
            grid-column: 2
        }

        .controls .left {
            grid-column: 1
        }

        .controls .down {
            grid-column: 2
        }

        .controls .right {
            grid-column: 3
        }

        .tip {
            color: #90a4ae;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 10px;
            text-align: center
        }
    </style>
</head>
<body>
<header>
    <h1>Math Quest Maze</h1>
    <a class="back" id="back" href="../index.html">返回</a>
</header>
<main>
    <div class="hud">
        <span id="q">题目加载中…</span>
        <span>得分 <b id="score">0</b> / 5</span>
        <span>生命 <b id="hp">3</b></span>
    </div>
    <canvas id="c" width="720" height="480"></canvas>
    <div class="controls">
        <button class="up" data-d="0,-1">↑</button>
        <button class="left" data-d="-1,0">←</button>
        <button class="down" data-d="0,1">↓</button>
        <button class="right" data-d="1,0">→</button>
    </div>
    <p class="tip">参照 MathQuestMaze：迷宫中有四个答案房间，走到正确答案得分；错误扣生命。键盘 WASD / 方向键也可。</p>
</main>
<script>
    MiniGames.requireLogin();
    document.getElementById('back').href = appUrl('/pages/mini/index.html');

    var canvas = document.getElementById('c');
    var canvasBuffer = new CanvasBuffer(canvas);
    var COLS = 15, ROWS = 10, TILE = 48;
    var maze, player, answers, question, score = 0, hp = 3, enemy;
    var backgroundDirty = true;

    function genMaze() {
        // 简易通道迷宫：外墙 + 若干内障
        maze = [];
        for (var y = 0; y < ROWS; y++) {
            maze[y] = [];
            for (var x = 0; x < COLS; x++) {
                maze[y][x] = (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) ? 1 : 0;
            }
        }
        for (var i = 0; i < 18; i++) {
            var x = 2 + Math.floor(Math.random() * (COLS - 4));
            var y = 2 + Math.floor(Math.random() * (ROWS - 4));
            if ((x + y) % 2 === 0) maze[y][x] = 1;
        }
        // 保证出生点空
        maze[1][1] = 0;
        maze[1][2] = 0;
        maze[2][1] = 0;
        backgroundDirty = true;
    }

    function makeQuestion() {
        var a = 2 + Math.floor(Math.random() * 12);
        var b = 1 + Math.floor(Math.random() * 12);
        var ops = ['+', '-', '×'];
        var op = ops[Math.floor(Math.random() * ops.length)];
        var ans = op === '+' ? a + b : (op === '-' ? a - b : a * b);
        if (op === '-' && ans < 0) {
            op = '+';
            ans = a + b;
        }
        question = {text: a + ' ' + op + ' ' + b + ' = ?', ans: ans};
        document.getElementById('q').textContent = question.text;
        var opts = [ans, ans + 1, ans - 1, ans + 2];
        opts = opts.filter(function (v, i, arr) {
            return arr.indexOf(v) === i;
        });
        while (opts.length < 4) opts.push(ans + opts.length + 3);
        opts.sort(function () {
            return Math.random() - 0.5;
        });
        // 四角附近放答案房
        var slots = [[2, 2], [COLS - 3, 2], [2, ROWS - 3], [COLS - 3, ROWS - 3]];
        answers = slots.map(function (s, i) {
            maze[s[1]][s[0]] = 0;
            return {x: s[0], y: s[1], v: opts[i]};
        });
        player = {x: 1, y: 1};
        enemy = {x: COLS - 2, y: ROWS - 2, t: 0};
        backgroundDirty = true;
    }

    function cacheBackground() {
        // 墙体与答案房保持不动时只缓存一次，每步仅合成玩家和敌人。
        canvasBuffer.cacheBackground(function (ctx) {
            for (var y = 0; y < ROWS; y++) {
                for (var x = 0; x < COLS; x++) {
                    ctx.fillStyle = maze[y][x] ? '#37474f' : '#455a64';
                    ctx.fillRect(x * TILE, y * TILE, TILE - 1, TILE - 1);
                }
            }
            answers.forEach(function (a) {
                ctx.fillStyle = '#00695c';
                ctx.fillRect(a.x * TILE + 4, a.y * TILE + 4, TILE - 9, TILE - 9);
                ctx.fillStyle = '#e0f2f1';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(a.v), a.x * TILE + TILE / 2, a.y * TILE + TILE / 2);
            });
        });
        backgroundDirty = false;
    }

    function draw() {
        if (backgroundDirty) cacheBackground();
        canvasBuffer.render(function (ctx) {
            ctx.fillStyle = '#ffca28';
            ctx.beginPath();
            ctx.arc(player.x * TILE + TILE / 2, player.y * TILE + TILE / 2, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ef5350';
            ctx.fillRect(enemy.x * TILE + 10, enemy.y * TILE + 10, TILE - 20, TILE - 20);
        });
    }

    function tryMove(dx, dy) {
        var nx = player.x + dx, ny = player.y + dy;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || maze[ny][nx]) return;
        player.x = nx;
        player.y = ny;
        // 敌人简单追踪
        enemy.t++;
        if (enemy.t % 2 === 0) {
            var ex = Math.sign(player.x - enemy.x), ey = Math.sign(player.y - enemy.y);
            if (ex && !maze[enemy.y][enemy.x + ex]) enemy.x += ex;
            else if (ey && !maze[enemy.y + ey][enemy.x]) enemy.y += ey;
        }
        if (enemy.x === player.x && enemy.y === player.y) {
            hp--;
            document.getElementById('hp').textContent = hp;
            player = {x: 1, y: 1};
            if (hp <= 0) {
                alert('生命耗尽，重新开始');
                score = 0;
                hp = 3;
                document.getElementById('score').textContent = 0;
                document.getElementById('hp').textContent = 3;
                genMaze();
                makeQuestion();
            }
        }
        for (var i = 0; i < answers.length; i++) {
            var a = answers[i];
            if (a.x === player.x && a.y === player.y) {
                if (a.v === question.ans) {
                    score++;
                    document.getElementById('score').textContent = score;
                    if (score >= 5) {
                        MiniCelebrate.play({title: '迷宫通关啦！', note: '连续答对 5 题，你太棒啦！', icon: '🦄'});
                        score = 0;
                        hp = 3;
                        document.getElementById('score').textContent = 0;
                        document.getElementById('hp').textContent = 3;
                    }
                    genMaze();
                    makeQuestion();
                } else {
                    hp--;
                    document.getElementById('hp').textContent = hp;
                    alert('答错了，再想想：' + question.text);
                    if (hp <= 0) {
                        alert('生命耗尽，重新开始');
                        score = 0;
                        hp = 3;
                        document.getElementById('score').textContent = 0;
                        document.getElementById('hp').textContent = 3;
                        genMaze();
                        makeQuestion();
                    } else {
                        player = {x: 1, y: 1};
                    }
                }
                break;
            }
        }
        draw();
    }

    document.querySelector('.controls').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var d = b.dataset.d.split(',').map(Number);
        tryMove(d[0], d[1]);
    };
    window.addEventListener('keydown', function (e) {
        var map = {
            ArrowUp: [0, -1],
            ArrowDown: [0, 1],
            ArrowLeft: [-1, 0],
            ArrowRight: [1, 0],
            w: [0, -1],
            s: [0, 1],
            a: [-1, 0],
            d: [1, 0],
            W: [0, -1],
            S: [0, 1],
            A: [-1, 0],
            D: [1, 0]
        };
        if (map[e.key]) {
            e.preventDefault();
            tryMove(map[e.key][0], map[e.key][1]);
        }
    });

    genMaze();
    makeQuestion();
    draw();
</script>
</body>
</html>
