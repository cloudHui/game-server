<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../../../shared/app-base.js"></script>
<script src="../../../shared/mini-base.js"></script>
<style>.mini-back{position:fixed;top:10px;left:10px;z-index:9999;padding:8px 12px;border-radius:8px;background:#1a535c;color:#fff;text-decoration:none;font:14px sans-serif}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字射击</title>
    <link rel="stylesheet" href="../../../shared/mini-fire-pad.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../shared/mini-result.css">
</head>
<body>
    <div class="game-container">
        <h1>数字射击</h1>
        <p class="subtitle">输入下落数字进行射击 · 击中后朗读中文读音 · 共 55 关</p>

        <section id="lobby">
            <h2>选择关卡</h2>
            <p id="unlockHint">已解锁 1 / 55 关 · 得分≥80 解锁下一关</p>
            <div id="levelGrid" class="level-grid"></div>
        </section>

        <section id="playPanel" style="display:none">
            <div class="game-info">
                <div id="levelLabel">第1关</div>
                <div>得分: <span id="score">0</span></div>
                <div>击中: <span id="hits">0/8</span></div>
                <div>时间: <span id="time">60</span>秒</div>
            </div>
            <div class="fire-status" id="fireStatus" aria-live="polite">
                <span class="fire-chip"><em>输入</em><b id="inputShow">—</b></span>
                <span class="fire-chip reading"><em>读音</em><b id="readingShow">—</b></span>
            </div>
            <canvas id="gameCanvas" width="800" height="560"></canvas>
            <p class="hint-mobile">手机可点下方数字键射击；退格删除，清空重输。</p>
            <div id="touchPad" aria-label="数字键盘"></div>
            <p class="hint-row">输入屏幕上的数字即可射击；退格删除，Esc 清空。多位数请连续输入。</p>
            <div class="controls">
                <button class="action secondary" id="btnBackLobby" type="button">返回选关</button>
            </div>
        </section>
    </div>

    <div id="resultPanel">
        <div class="result-card">
            <h2 id="resultTitle">你太棒了！</h2>
            <div class="result-score"><span id="resultScore">0</span> 分</div>
            <p class="result-detail" id="resultDetail">击中 0 · 漏掉 0 · 误输 0</p>
            <div class="controls">
                <button class="action" id="btnNext" type="button">进入下一关</button>
                <button class="action secondary" id="btnRetry" type="button">再玩一次</button>
                <button class="action secondary" id="btnLobby" type="button">返回选关</button>
            </div>
        </div>
    </div>

    <div style="display:none">
        <svg id="planeSvg" width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 10 L70 30 L40 50 L10 30 Z" fill="#4ECDC4" stroke="#1A535C" stroke-width="2"/>
            <path d="M20 30 L60 30 L50 40 L30 40 Z" fill="#FFE66D" stroke="#1A535C" stroke-width="2"/>
            <path d="M10 30 L20 20 L20 40 Z" fill="#FFE66D" stroke="#1A535C" stroke-width="2"/>
            <circle cx="30" cy="30" r="4" fill="#FFFFFF"/>
            <circle cx="50" cy="30" r="4" fill="#FFFFFF"/>
            <path d="M35 20 Q40 25 45 20" stroke="#1A535C" stroke-width="2" fill="none"/>
        </svg>
    </div>

    <script src="../../../shared/mini-fire-pad.js"></script>
    <script src="../../../shared/mini-fire-speech.js"></script>
    <script src="../../../shared/mini-result.js"></script>
    <script src="levels.js"></script>
    <script src="render.js"></script>
    <script src="ui.js"></script>
    <script src="engine.js"></script>
    <script src="game.js"></script>
    <script>if(window.MiniGames)MiniGames.requireLogin();</script>
</body>
</html>
