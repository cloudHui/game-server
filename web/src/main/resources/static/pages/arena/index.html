<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>剑气除魔</title>
    <link rel="stylesheet" href="arena.css">
    <link rel="stylesheet" href="arena-extra.css">
    <link rel="stylesheet" href="connection.css">
</head>
<body>
<header>
    <div><h1>剑气除魔</h1><small>洞府养成 · 镇魔副本 · 仙缘招募 · 云海擂台</small></div>
    <div><span id="connection" class="connection connecting">连接中</span>　<a href="../lobby/entertainment.html">返回大厅</a></div>
</header>
<main>
    <div id="resources"></div>
    <nav>
        <button class="active" data-page="home">洞府</button><button data-page="cultivate">培养</button>
        <button data-page="dungeon">副本</button><button data-page="recruit">抽卡</button>
        <button data-page="tasks">每日任务</button><button data-page="formation">战阵</button>
        <button data-page="gear">神装</button><button data-page="arena">对战</button>
    </nav>
    <section id="home" class="page active">
        <div class="banner"><small>当前出战</small><h2>无极剑皇</h2><p>金 · 强攻 · 万剑归宗</p><div id="overview" class="overview"></div></div>
        <article><h2>洞府灵脉</h2><p>最多储存 12 小时至尊灵液，领取计入每日任务。</p><button class="gold" data-action="grotto">领取洞府产出</button></article>
    </section>
    <section id="cultivate" class="page"><h2>仙侣培养</h2><div id="cultivate-grid" class="grid"></div></section>
    <section id="library" class="page"><div class="title"><h2>无尽书阁</h2><b>炼丹 · 炼器</b></div><div id="inventory" class="grid"></div><div id="recipes" class="grid"></div></section>
    <section id="journey" class="page"><div class="title"><h2>历练地图</h2><b id="stamina"></b></div><div id="journey-maps" class="grid"></div></section>
    <section id="dungeon" class="page"><div class="title"><div><h2>镇魔副本</h2><p>章节推图 · 战力校验 · 首通奖励</p></div><b id="attempts"></b></div><div id="dungeon-result"></div><div id="dungeon-grid" class="grid"></div></section>
    <section id="recruit" class="page"><div class="summon"><h2>太初仙缘</h2><p>红色概率 2%，十连至少红色，90 抽金色保底；重复仙侣转为碎片。</p><b id="pity"></b><div><button class="ghost" data-draw="1">招募一次 · 仙缘×1</button><button class="gold" data-draw="10">招募十次 · 仙缘×10</button></div><div id="draw-result"></div></div></section>
    <section id="tasks" class="page"><div class="title"><h2>每日任务</h2><b id="activity"></b></div><div id="activity-chests" class="chests"></div><div id="task-list"></div></section>
    <section id="formation" class="page"><article><h2>诛仙剑阵</h2><p>上阵后提升最终攻击、命中与暴击。</p><b id="formation-level"></b><button class="gold" data-action="formation">升级战阵</button></article></section>
    <section id="gear" class="page"><h2>神装宝库</h2><div id="gear-grid" class="grid"></div></section>
    <section id="arena" class="page"><h2>云海擂台</h2><div class="versus"><select id="attacker"></select><b>VS</b><select id="defender"></select></div><button id="fight" class="gold">御剑挑战</button><div id="battle-log"></div></section>
</main>
<div id="toast"></div>
<script src="arena-config.js"></script><script src="arena.js"></script><script src="library.js"></script><script src="journey.js"></script><script src="connection.js"></script>
</body>
</html>
