server:
  port: 8081
  address: 127.0.0.1
  servlet:
    context-path: /
  forward-headers-strategy: native
  compression:
    enabled: true
    min-response-size: 1024

spring:
  application:
    name: web
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

gate:
  host: 127.0.0.1
  port: 5600

lobby:
  admin-http: http://127.0.0.1:5701

game:
  replay-dir: build/game/replay

capabilities:
  game-host: 127.0.0.1
  game-port: 5500
  center-host: 127.0.0.1
  center-port: 5400

# 账号（与 Lobby 共用 data/lobby.db；Web 主鉴权）
account:
  db-path: ${ACCOUNT_DB_PATH:data/lobby.db}
  open-register: ${OPEN_REGISTER:false}

# 学习模块（数据相对仓库根，web 工作目录为仓库根）
family-learning:
  data-dir: ${LEARNING_DATA_DIR:data/learning}
  resource-dir: ${LEARNING_RESOURCE_DIR:data/learning/resources}
  dataset-dir: ${LEARNING_DATASET_DIR:data/learning/datasets}
  registration:
    open-enabled: false
  session:
    idle-minutes: ${SESSION_IDLE_MINUTES:30}
  report:
    cron: ${REPORT_CRON:0 55 23 * * *}
    zone: ${REPORT_ZONE:Asia/Shanghai}
    recipient: ${REPORT_RECIPIENT:}
