syntax = "proto3";
option java_outer_classname = "ConstProto";

package proto;

//错误码
enum Result{
    SUCCESS = 0;
    SERVER_NULL = 1;//服务空
    TIME_OUT = 2;//回复超时
    SERVER_ERROR = 3;//服务错误
    TABLE_START = 4;//桌子已经开始
    TABLE_NOT_START = 5;//桌子未开始
    TABLE_CONFIG_ERROR = 6;//桌子配置错误
    TABLE_NULL = 7;//桌子空
    TABLE_FULL = 8;//桌子满
    TABLE_ERROR = 9;//桌子异常
    ROLE_ERROR = 10;//玩家异常
    ROLE_NULL = 11;//玩家空
    OP_CURR_ERROR = 12;//当前操作位置没有操作
    OP_CARD_NOT_MATCH = 13;//操作牌数不匹配
}

//room状态
// TODO: WAITE was renamed to WAIT. Regenerate Java code and update TableInfo.java references (ConstProto.TableState.WAITE -> WAIT)
enum TableState{
    WAIT = 0;//等待
    START = 1;//开始
}

//操作选择
enum Operation{
    PASS = 0;//过
    CALL = 1;//叫地主(兼容)
    ROB = 2;//抢地主
    NOT_CALL = 3;//不叫地主
    NOT_ROB = 4;//不抢地主
    TIP = 5;//提示
    PLAY = 6;//出
    PREPARE = 7;//准备
    START_GAME = 8;//开始
    CALL_SCORE_1 = 9;//叫一分
    CALL_SCORE_2 = 10;//叫二分
    CALL_SCORE_3 = 11;//叫三分
    DRAW = 12;//摸牌(麻将)
    DISCARD = 13;//出牌(麻将)
    MJ_PENG = 14;//碰(麻将)
    MJ_GANG = 15;//杠(麻将)
    MJ_CHI = 16;//吃(麻将)
    MJ_HU = 17;//胡(麻将)
    MJ_PASS = 18;//过(麻将)
    // 牛牛操作
    NIU_NO_ROB = 20;//牛牛不抢
    NIU_ROB_1 = 21;//牛牛抢1倍
    NIU_ROB_2 = 22;//牛牛抢2倍
    NIU_ROB_3 = 23;//牛牛抢3倍
    NIU_ROB_4 = 24;//牛牛抢4倍
    NIU_BET_1 = 25;//牛牛下注1倍
    NIU_BET_2 = 26;//牛牛下注2倍
    NIU_BET_3 = 27;//牛牛下注3倍
    NIU_BET_4 = 28;//牛牛下注4倍
    NIU_BET_5 = 29;//牛牛下注5倍
    NIU_SHOW = 30;//牛牛拼牛摊牌
}

//牌型
enum CardType{
    SINGLE = 0;//单
    DOUBLE = 1;//对子
    TRIPLE = 2;//三不带
    TRIPLE_ONE = 3;//三带一
    TRIPLE_DOUBLE = 4;//三带二
    PLANE_ONE = 5;//飞机带一
    PLANE_DOUBLE = 6;//飞机带二
    BOOM_DOUBLE_SINGLE = 7;//炸弹带二单
    BOOM_DOUBLE_PAIR = 8;//炸弹带二对  // renamed from BOOM_DOUBLE_CUP (CUP was unclear)
    STRAIGHT = 9;//顺子
    STRAIGHT_DOUBLE = 10;//连对子
    BOOM = 11;//炸弹
    BOOM_MAX = 12;//双王炸
    // 牛牛牌型
    NIU_NONE = 20;//无牛
    NIU_1 = 21;//牛一
    NIU_2 = 22;//牛二
    NIU_3 = 23;//牛三
    NIU_4 = 24;//牛四
    NIU_5 = 25;//牛五
    NIU_6 = 26;//牛六
    NIU_7 = 27;//牛七
    NIU_8 = 28;//牛八
    NIU_9 = 29;//牛九
    NIU_NIU = 30;//牛牛
    NIU_FOUR_FLOWERS = 31;//四花牛
    NIU_FIVE_FLOWERS = 32;//五花牛
    NIU_BOMB = 33;//炸弹牛
    NIU_FIVE_SMALL = 34;//五小牛
}