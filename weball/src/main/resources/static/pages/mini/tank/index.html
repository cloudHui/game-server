<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>坦克大战 · 休闲</title>
    <script src="../../../shared/app-base.js"></script>
    <script src="../../../shared/mini-base.js"></script>
    <script src="../../../shared/mini-feedback.js"></script>
    <script src="tank-config.js"></script>
    <script src="tank-engine.js"></script>
    <script src="tank-map.js"></script>
    <script src="tank-renderer.js"></script>
    <script src="tank-input.js"></script>
    <link rel="stylesheet" href="../../../shared/mini-board-fit.css">
    <link rel="stylesheet" href="../../../shared/mini-celebrate.css">
    <script src="../../../shared/mini-celebrate.js"></script>
    <link rel="stylesheet" href="tank.css">
</head>
<body>
<div class="header">
    <h1>坦克大战</h1>
    <div>
        <span id="userDisplay"></span>
        <a class="header-btn" id="backLink" href="../index.html">返回小游戏</a>
    </div>
</div>
<div class="wrap">
    <div class="panel">
        <div class="hud">
            <span id="status">按开始进入战斗</span>
            <span id="scoreHud">得分 0 · 关卡 1</span>
        </div>
        <div class="board-wrap">
            <canvas id="game" width="520" height="520"></canvas>
            <div id="tankResult" class="result-panel" hidden>
                <h2>战斗结束</h2><p id="tankResultText"></p>
                <button type="button" id="retryBtn">重新出发</button>
            </div>
        </div>
        <div class="actions">
            <button type="button" id="startBtn">开始游戏</button>
            <button type="button" id="resetBtn" class="secondary">重来</button>
        </div>
        <div class="shop" aria-label="战场补给站">
            <span>补给站：</span>
            <button type="button" id="buyRepair">修复基地</button>
            <button type="button" id="buyLife">增加生命</button>
            <button type="button" id="buyArmor">基地钢墙</button>
        </div>
        <div class="pad" id="pad">
            <span></span>
            <button type="button" data-dir="0">↑</button>
            <span></span>
            <button type="button" data-dir="3">←</button>
            <button type="button" class="fire" data-fire="1">开火</button>
            <button type="button" data-dir="1">→</button>
            <span></span>
            <button type="button" data-dir="2">↓</button>
            <span></span>
        </div>
        <p class="hint">键盘：方向键 / WASD 移动，空格开火。消灭敌方坦克过关，撞墙或被击中会损血。</p>
    </div>
</div>
<script src="tank-game.js"></script>
</body>
</html>
