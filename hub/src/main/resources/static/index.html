<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休闲 · 登录</title>
    <style>
        :root {
            --ruoyi-primary: #409eff;
            --ruoyi-primary-hover: #66b1ff;
            --ruoyi-bg: #1f2d3d;
            --ruoyi-card: #ffffff;
            --ink: #303133;
            --muted: #909399;
            --danger: #f56c6c;
            --accent: #409eff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 15%, rgba(64, 158, 255, 0.18), transparent 50%),
                        radial-gradient(ellipse at 80% 85%, rgba(30, 64, 175, 0.3), transparent 50%),
                        linear-gradient(135deg, #1f2d3d 0%, #111827 50%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .shell {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 8px;
            padding: 36px 32px 30px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .shell::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 3.5px;
            background: linear-gradient(90deg, #1890ff, #409eff, #36cfc9);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            margin: 0 auto 12px;
            background: rgba(64, 158, 255, 0.1);
            border: 1px solid rgba(64, 158, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #409eff;
        }

        .brand h1 {
            font-size: 22px;
            letter-spacing: 0.04em;
            color: #303133;
            font-weight: 700;
        }

        .brand p {
            margin-top: 6px;
            color: #909399;
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: #f0f2f5;
            border-radius: 6px;
            padding: 3px;
        }

        .tabs button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 9px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13.5px;
            color: #606266;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tabs button.active {
            background: #ffffff;
            color: #409eff;
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        label {
            display: block;
            font-size: 12.5px;
            color: #606266;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .field {
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 0 14px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            background: #ffffff;
            color: #303133;
            transition: border-color .2s, box-shadow .2s;
        }

        input:focus {
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.15);
        }

        .primary {
            width: 100%;
            margin-top: 6px;
            height: 42px;
            border: none;
            border-radius: 4px;
            background: #409eff;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.06em;
            transition: background-color .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .primary:hover:not(:disabled) {
            background: #66b1ff;
        }

        .error {
            min-height: 20px;
            margin-top: 12px;
            color: var(--danger);
            font-size: 13px;
            text-align: center;
        }

        .hint {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .panel {
            display: none;
        }

        .panel.show {
            display: block;
        }

        /* 拉回桌子 */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(2px);
            z-index: 20;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
            border: 1px solid #ebeef5;
        }

        .modal h2 {
            font-size: 17px;
            margin-bottom: 8px;
            color: #303133;
            font-weight: 600;
        }

        .modal .sub {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .table-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #f8f9fa;
            border: 1px solid #ebeef5;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .table-item button {
            border: none;
            background: #409eff;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background .2s;
        }

        .table-item button:hover {
            background: #66b1ff;
        }

        .skip-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border: 1px solid #dcdfe6;
            background: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            color: #606266;
            font-size: 13px;
            transition: all .2s;
        }

        .skip-btn:hover {
            background: #f5f7fa;
            color: #409eff;
            border-color: #c6e2ff;
        }

        .resume-box {
            display: none;
            background: #ecf5ff;
            border: 1px solid #d9ecff;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 16px;
            text-align: left;
        }

        .resume-box.show {
            display: block;
        }

        .resume-box p {
            font-size: 13px;
            color: #409eff;
            margin-bottom: 10px;
        }

        .resume-actions {
            display: flex;
            gap: 8px;
        }

        .resume-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }

        .resume-go {
            background: #409eff;
            color: #ffffff;
        }

        .resume-go:hover {
            background: #66b1ff;
        }

        .resume-clear {
            background: #ffffff;
            border: 1px solid #dcdfe6 !important;
            color: #606266;
        }

        .footer-copyright {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            letter-spacing: 0.04em;
        }
    </style>
    <!--
        该页面可能经过 HTTPS 反向代理访问。先提供最小的同源路径函数，
        这样即使旧缓存/代理把 app-base.js 误解析成 HTTP，登录流程也不会失效。
    -->
    <script>
        window.APP_BASE = '/Baa3SVlpDCyPh9T9v0';
        window.appUrl = window.appUrl || function (path) {
            if (!path) return window.APP_BASE + '/';
            return window.APP_BASE + (path.charAt(0) === '/' ? path : '/' + path);
        };
    </script>
    <script src="./shared/app-base.js"></script>
    <script src="./shared/room-config.js"></script>
</head>
<body class="page-theme">
<div class="shell">
    <div class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 2 7 12 12 22 7 12 2" fill="rgba(64,158,255,0.4)" stroke="#409eff" />
                <polyline points="2 17 12 22 22 17" stroke="#409eff" />
                <polyline points="2 12 12 17 22 12" stroke="#409eff" />
            </svg>
        </div>
        <h1>Hub 综合管理系统</h1>
        <p id="brandHint">若依架构风格 · 账号登录与统一认证</p>
    </div>
    <div class="resume-box" id="resumeBox">
        <p>检测到已登录账号：<strong id="resumeName"></strong></p>
        <div class="resume-actions">
            <button type="button" class="resume-go" onclick="resumeSession()">继续进入</button>
            <button type="button" class="resume-clear" onclick="clearSession()">换号登录</button>
        </div>
    </div>
    <div class="tabs">
        <button type="button" id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
        <button type="button" id="tabRegister" style="display:none" onclick="switchTab('register')">注册</button>
    </div>

    <div id="loginPanel" class="panel show">
        <div class="field">
            <label>用户名</label>
            <input id="loginUser" autocomplete="username" placeholder="用户名">
        </div>
        <div class="field">
            <label>密码</label>
            <input id="loginPass" type="password" autocomplete="current-password" placeholder="密码">
        </div>
        <button class="primary" id="loginBtn" onclick="doLogin()">进入大厅</button>
    </div>

    <div id="registerPanel" class="panel" style="display:none">
        <div class="field">
            <label>用户名</label>
            <input id="regUser" autocomplete="username" placeholder="用户名">
        </div>
        <div class="field">
            <label>昵称（可选）</label>
            <input id="regNick" placeholder="默认同用户名">
        </div>
        <div class="field">
            <label>密码</label>
            <input id="regPass" type="password" autocomplete="new-password" placeholder="密码">
        </div>
        <div class="field" id="inviteField">
            <label>邀请码</label>
            <input id="regInvite" placeholder="邀请码">
        </div>
        <button class="primary" id="regBtn" onclick="doRegister()">注册并进入</button>
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="hint" id="regHint" style="display:none">邀请码已带入，可注册</div>
</div>

<div class="footer-copyright">
    Copyright © 2026 Game Server Hub · RuoYi Architecture Style
</div>

<div class="overlay" id="tableOverlay">
    <div class="modal">
        <h2>你还有未结束的牌桌</h2>
        <p class="sub">选择一张回到对局，或暂不进入去大厅</p>
        <div id="tableList"></div>
        <button class="skip-btn" onclick="skipTables()">暂不进入</button>
    </div>
</div>

    <link rel="stylesheet" href="shared/theme.css">
    <script>
    var registrationAvailable = false;
    var pendingAuth = null;
    var savedToken = null;

    window.onload = function () {
        var params = new URLSearchParams(window.location.search);
        var invite = params.get('invite');
        if (invite && invite.trim()) {
            registrationAvailable = true;
            document.getElementById('tabRegister').style.display = '';
            document.getElementById('registerPanel').style.display = '';
            document.getElementById('regHint').style.display = '';
            document.getElementById('brandHint').textContent = '登录 · 注册 · 邀请入局';
            switchTab('register');
            document.getElementById('regInvite').value = invite.trim();
        } else {
            switchTab('login');
        }
        savedToken = localStorage.getItem('token');
        var nick = localStorage.getItem('nickname') || localStorage.getItem('username');
        if (savedToken && nick) {
            document.getElementById('resumeName').textContent = nick;
            document.getElementById('resumeBox').className = 'resume-box show';
        }
    };

    function resumeSession() {
        if (!savedToken) return;
        document.getElementById('resumeBox').className = 'resume-box';
        setError('恢复登录中...');
        restoreToken(savedToken);
    }

    function clearSession() {
        localStorage.clear();
        savedToken = null;
        document.getElementById('resumeBox').className = 'resume-box';
        setError('');
    }

    function switchTab(name) {
        if (name === 'register' && !registrationAvailable) name = 'login';
        document.getElementById('tabLogin').className = name === 'login' ? 'active' : '';
        document.getElementById('tabRegister').className = name === 'register' ? 'active' : '';
        document.getElementById('loginPanel').className = 'panel' + (name === 'login' ? ' show' : '');
        document.getElementById('registerPanel').className = 'panel' + (name === 'register' ? ' show' : '');
        document.getElementById('errorMsg').textContent = '';
    }

    function setError(msg) {
        document.getElementById('errorMsg').textContent = msg || '';
    }

    function restoreToken(token) {
        fetch(appUrl('/api/auth/login'), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: token})
        })
            .then(function (r) {
                return r.json();
            })
            .then(function (data) {
                if (data.code === 0) {
                    onAuthSuccess(data);
                } else {
                    setError(data.msg || '登录已失效，请重新登录');
                    clearSession();
                }
            })
            .catch(function () {
                setError('网络错误，请重试');
            });
    }

    function doLogin() {
        var username = document.getElementById('loginUser').value.trim();
        var password = document.getElementById('loginPass').value;
        if (!username || !password) {
            setError('请输入用户名和密码');
            return;
        }
        var btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中...';
        setError('');
        fetch(appUrl('/api/auth/login'), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: username, password: password})
        })
            .then(function (r) {
                return r.json();
            })
            .then(function (data) {
                btn.disabled = false;
                btn.textContent = '进入大厅';
                if (data.code === 0) {
                    onAuthSuccess(data);
                } else {
                    setError(data.msg || '登录失败');
                }
            })
            .catch(function () {
                btn.disabled = false;
                btn.textContent = '进入大厅';
                setError('网络错误，请重试');
            });
    }

    function doRegister() {
        if (!registrationAvailable) return;
        var username = document.getElementById('regUser').value.trim();
        var password = document.getElementById('regPass').value;
        var nickname = document.getElementById('regNick').value.trim();
        var invite = document.getElementById('regInvite').value.trim();
        if (!username || !password) {
            setError('请输入用户名和密码');
            return;
        }
        if (!invite) {
            setError('请填写邀请码');
            return;
        }
        var btn = document.getElementById('regBtn');
        btn.disabled = true;
        btn.textContent = '注册中...';
        setError('');
        fetch(appUrl('/api/auth/register'), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: username,
                password: password,
                nickname: nickname || username,
                invite: invite
            })
        })
            .then(function (r) {
                return r.json();
            })
            .then(function (data) {
                btn.disabled = false;
                btn.textContent = '注册并进入';
                if (data.code === 0) {
                    onAuthSuccess(data);
                } else {
                    setError(data.msg || '注册失败');
                }
            })
            .catch(function () {
                btn.disabled = false;
                btn.textContent = '注册并进入';
                setError('网络错误，请重试');
            });
    }

    function onAuthSuccess(data) {
        localStorage.setItem('sessionId', data.sessionId);
        localStorage.setItem('userId', data.userId);
        localStorage.setItem('username', data.username || '');
        localStorage.setItem('nickname', data.nickname || '');
        localStorage.setItem('token', data.token || '');
        localStorage.setItem('isAdmin', data.isAdmin ? '1' : '0');
        pendingAuth = data;
        var tableInfos = data.tableInfos || [];
        var tables = data.tables || [];
        if (tableInfos.length > 0) {
            showTablePickerFromInfos(tableInfos);
        } else if (tables.length > 0) {
            showTablePicker(tables);
        } else {
            goHall();
        }
    }

    function goGameTable(tableId, roomId, gameType) {
        var gt = Number(gameType || 2);
        localStorage.setItem('tableId', tableId);
        localStorage.setItem('roomId', roomId || 0);
        localStorage.setItem('gameType', gt);
        var meta = window.RoomConfig ? RoomConfig.game(gt) : {page: '/pages/games/doudizhu/index.html'};
        window.location.href = appUrl(meta.page);
    }

    function showTablePickerFromInfos(infos) {
        var list = document.getElementById('tableList');
        list.innerHTML = '';
        for (var i = 0; i < infos.length; i++) {
            (function (info) {
                var name = (window.RoomConfig && RoomConfig.game(info.gameType).name) || '牌桌';
                var row = document.createElement('div');
                row.className = 'table-item';
                row.innerHTML = '<span>' + name + ' · 桌号 ' + info.tableId + '</span>';
                var btn = document.createElement('button');
                btn.textContent = '进入';
                btn.onclick = function () {
                    enterTableDirect(info);
                };
                row.appendChild(btn);
                list.appendChild(row);
            })(infos[i]);
        }
        document.getElementById('tableOverlay').className = 'overlay show';
    }

    function showTablePicker(tables) {
        var list = document.getElementById('tableList');
        list.innerHTML = '';
        for (var i = 0; i < tables.length; i++) {
            (function (tid) {
                var row = document.createElement('div');
                row.className = 'table-item';
                row.innerHTML = '<span>桌号 ' + tid + '</span>';
                var btn = document.createElement('button');
                btn.textContent = '进入';
                btn.onclick = function () {
                    enterTable(tid);
                };
                row.appendChild(btn);
                list.appendChild(row);
            })(tables[i]);
        }
        document.getElementById('tableOverlay').className = 'overlay show';
    }

    function skipTables() {
        document.getElementById('tableOverlay').className = 'overlay';
        goHall();
    }

    function enterTableDirect(info) {
        goGameTable(info.tableId, info.roomId || 0, info.gameType || 2);
    }

    function enterTable(tableId) {
        var sessionId = localStorage.getItem('sessionId');
        fetch(appUrl('/api/rooms?sessionId=' + encodeURIComponent(sessionId)))
            .then(function (r) {
                return r.json();
            })
            .then(function (data) {
                var gameType = 2;
                var roomId = 0;
                if (data.code === 0 && data.rooms) {
                    for (var i = 0; i < data.rooms.length; i++) {
                        var room = data.rooms[i];
                        var tables = room.tables || [];
                        for (var j = 0; j < tables.length; j++) {
                            if (String(tables[j].tableId) === String(tableId)) {
                                gameType = room.gameType;
                                roomId = room.roomId;
                            }
                        }
                    }
                }
                goGameTable(tableId, roomId, gameType);
            })
            .catch(function () {
                goGameTable(tableId, 0, 2);
            });
    }

    function goHall() {
        window.location.href = appUrl('/pages/lobby/index.html');
    }

    document.getElementById('loginPass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') doLogin();
    });
    document.getElementById('regPass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') doRegister();
    });
</script>
</body>
</html>
